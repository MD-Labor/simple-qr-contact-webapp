<h2>Examination eligibility</h2>
<form>
	<label>Years of experience <input name="experienceYears" type="number" min="0" required></label>
	<label>Exam status
		<select name="examStatus" required>
			<option value="">Choose one</option>
			<option value="passed">I have passed the exam</option>
			<option value="scheduled">I plan to take the exam</option>
		</select>
	</label>
	<button type="button" data-back>Back</button>
	<button>Next</button>
</form>
